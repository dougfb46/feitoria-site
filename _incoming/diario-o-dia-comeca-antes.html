14px\">O dia começa antes de você chegar<\u002Fh1>\n      <p class=\"art-dek\">Às sete da manhã não tem música nem copo cheio. Tem caixa chegando, faca sendo afiada e linha de chopp sendo limpa.<\u002Fp>\n      <p class=\"art-meta\">\n        <time datetime=\"2026-08-05\">5 ago 2026<\u002Ftime>\n        <span aria-hidden=\"true\">·<\u002Fspan>\n        <span>3 min de leitura<\u002Fspan>\n      <\u002Fp>\n      <figure class=\"art-fig\">\n        <div class=\"ph washed\" style=\"aspect-ratio:3/2\">\n          <img src=\"b7a46254-f1e4-4cdd-b134-6269f168c47d\" srcset=\"06678a2b-c857-49ba-936d-1e65d24eaa66 467w, b7a46254-f1e4-4cdd-b134-6269f168c47d 800w\" sizes=\"(max-width: 760px) 100vw, 720px\" width=\"800\" height=\"1200\" fetchpriority=\"high\" decoding=\"async\" alt=\"Bastidores da cozinha da Feitoria antes da abertura\">\n        <\u002Fdiv>\n      <\u002Ffigure>\n      <h2>Primeiro entra a comida<\u002Fh2>\n      <p>O dia abre com recebimento. Caixa por caixa, olhando, cheirando, devolvendo o que não está bom. É a etapa mais chata e a que mais define como vai ser o prato da noite.<\u002Fp>\n      <p>Depois vem o pré-preparo: molho no fogo, mandioca cozinhando, carne temperada, massa descansando. Quando a casa abre, a cozinha já trabalhou meio turno.<\u002Fp>\n      <h2>A linha de chopp é limpa todo dia<\u002Fh2>\n      <p>Chopp bom é chopp de linha limpa. Tubulação, torneira, engate: tudo passa por rotina de higienização, e o primeiro copo do dia é sempre descartado.<\u002Fp>\n      <p>Também checamos pressão e temperatura antes de abrir. Espuma errada quase nunca é culpa da receita — é da pressão.<\u002Fp>\n      <h2>O quintal ganha o primeiro turno<\u002Fh2>\n      <p>Mesa limpa, luz testada, folha varrida, ventilador ou aquecedor conforme o dia. De manhã a casa é só barulho de cadeira arrastando.<\u002Fp>\n      <p>Quando tem show, o som é passado antes de o primeiro cliente sentar. Ninguém merece passagem de som com o copo na mão.<\u002Fp>\n      <h2>Meio-dia, tudo em posição<\u002Fh2>\n      <p>Antes de abrir, a equipe prova o que vai vender. O que está na torneira, o prato do dia, o que mudou no cardápio — todos experimentam.<\u002Fp>\n      <p>Não é ritual bonito para foto: é para que qualquer pessoa da casa consiga responder quando você perguntar \"o que você me indica?\".<\u002Fp>\n      <div class=\"art-cta\">\n        <a class=\"btn btn-secondary\" href=\"../quem-somos.html#diario\">Voltar ao Diário<\u002Fa>\n        <a class=\"btn btn-ghost\" href=\"https://cardapio.takeat.app/feitoriapubcafe\" target=\"_blank\" rel=\"noopener\" data-ev=\"clique_cardapio\">Ver o cardápio<\u002Fa>\n        <a class=\"btn btn-ghost\" href=\"https://www.instagram.com/feitoria.mogi/\" target=\"_blank\" rel=\"noopener\" data-ev=\"clique_instagram\">@feitoria.mogi<\u002Fa>\n        <a class=\"btn btn-primary\" href=\"../index.html#reservas\" data-ev=\"clique_reservar\">Reservar mesa<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Farticle>\n\n  <aside class=\"on-surface\">\n    <div class=\"wrap sec-sm\">\n      <h2 class=\"h-sub\" style=\"max-width:16ch;margin-bottom:clamp(24px,3vw,36px)\">Continue lendo.<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:clamp(20px,2.6vw,32px)\">\n        <a class=\"card\" href=\"o-que-entra-na-torneira.html\" data-ev=\"abrir_artigo\">\n          <div class=\"ph washed r1610\" style=\"border-radius:0\"><img src=\"0a3139c1-212b-4de1-8a4b-2e1e7340e682\" width=\"675\" height=\"1200\" loading=\"lazy\" decoding=\"async\" alt=\"Torneiras da Feitoria servindo o chopp da casa\"><\u002Fdiv>\n          <div class=\"card-in\">\n            <p class=\"card-kicker\">Taplist · Cervejaria<\u002Fp>\n            <h3 class=\"card-title\">Como a gente escolhe o que entra na torneira<\u002Fh3>\n            <p class=\"card-meta\">2 set 2026 · 4 min<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fa>\n        <a class=\"card\" href=\"do-grao-ao-copo.html\" data-ev
