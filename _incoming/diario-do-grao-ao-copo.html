    console.error('Bundle unpack error:', err);

4vw,54px);line-height:1.06;margin-top:14px\">Do grão ao copo: o caminho do nosso chopp<\u002Fh1>\n      <p class=\"art-dek\">Malte, água, lúpulo e levedura. Quatro ingredientes, várias semanas e um punhado de decisões que mudam tudo no sabor.<\u002Fp>\n      <p class=\"art-meta\">\n        <time datetime=\"2026-08-26\">26 ago 2026<\u002Ftime>\n        <span aria-hidden=\"true\">·<\u002Fspan>\n        <span>5 min de leitura<\u002Fspan>\n      <\u002Fp>\n      <figure class=\"art-fig\">\n        <div class=\"ph washed\" style=\"aspect-ratio:3/2\">\n          <img src=\"d9d939f9-5c36-4e5c-bda3-1f6dbbd8566d\" srcset=\"1d913035-f5de-4494-a765-c6be96979ea1 394w, d9d939f9-5c36-4e5c-bda3-1f6dbbd8566d 675w\" sizes=\"(max-width: 760px) 100vw, 720px\" width=\"675\" height=\"1200\" fetchpriority=\"high\" decoding=\"async\" alt=\"Chopp sendo tirado na torneira da Feitoria\">\n        <\u002Fdiv>\n      <\u002Ffigure>\n      <h2>Começa moendo grão<\u002Fh2>\n      <p>O malte é cevada que germinou e foi seca. Moído na medida certa (nem farinha, nem grão inteiro), ele vai para a água quente e libera o açúcar que a levedura vai comer depois. Essa etapa é a mostura, e a temperatura dela decide se a cerveja vai ficar mais corpulenta ou mais seca.<\u002Fp>\n      <p>Alguns graus de diferença aqui mudam a sensação na boca do copo final. É a decisão mais silenciosa e uma das mais importantes do processo.<\u002Fp>\n      <h2>Ferve, e é aí que entra o lúpulo<\u002Fh2>\n      <p>O líquido doce que sai da mostura vai para a fervura. Lúpulo adicionado no começo dá amargor; adicionado no fim, dá aroma. É a mesma planta fazendo dois trabalhos diferentes, e a hora do relógio é que separa um do outro.<\u002Fp>\n      <p>Quando você sente cheiro de fruta tropical numa IPA, não tem fruta nenhuma ali. É lúpulo colocado tarde, de propósito.<\u002Fp>\n      <h2>A levedura faz o trabalho pesado<\u002Fh2>\n      <p>Resfriado o líquido, entra a levedura. Ela come açúcar e devolve álcool, gás e uma pilha de compostos de sabor. Levedura de lager trabalha no frio e devagar, deixando o copo limpo. Levedura de ale trabalha mais quente e mais rápido, e deixa marcas: banana, cravo, frutas.<\u002Fp>\n      <p>A diferença entre uma pilsen e uma weizen começa aqui, muito antes de o copo chegar à mesa.<\u002Fp>\n      <h2>Maturação: a parte que ninguém vê<\u002Fh2>\n      <p>Depois da fermentação vem a espera. Semanas no frio, arestas se acomodando, sabor ficando redondo. Não tem atalho para essa etapa — só tempo e tanque ocupado.<\u002Fp>\n      <p>É por isso que a gente não promete data para um lote novo. Ele sobe para a torneira quando está pronto, não quando dá vontade.<\u002Fp>\n      <h2>Do tanque até o seu copo<\u002Fh2>\n      <p>Chopp é a mesma cerveja sem a viagem: sai do tanque, vai para o barril e do barril para a torneira, gelado e sem pasteurizar. Menos etapas entre a fábrica e a mesa significa mais aroma preservado.<\u002Fp>\n      <p>É a vantagem de ter a produção na própria Feitoria: o barril sai da fábrica direto para a nossa torneira. O copo que você bebe aqui é o mais fresco que essa receita consegue ser.<\u002Fp>\n      <div class=\"art-cta\">\n        <a class=\"btn btn-secondary\" href=\"../quem-somos.html#diario\">Voltar ao Diário<\u002Fa>\n        <a class=\"btn btn-ghost\" href=\"https://cardapio.takeat.app/feitoriapubcafe\" target=\"_blank\" rel=\"noopener\" data-ev=\"clique_cardapio\">Ver o cardápio<\u002Fa>\n        <a class=\"btn btn-ghost\" href=\"https://www.instagram.com/feitoria.mogi/\" target=\"_blank\" rel=\"noopener\" data-ev=\"clique_instagram\">@feitoria.mogi<\u002Fa>\n        <a class=\"btn btn-primary\" href=\"../index.html#reservas\" data-ev=\"clique_reservar\">Reservar mesa<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Farticle>\n\n  <aside class=\"on-surface\">\n    <div class=\"wrap sec-sm\">\n      <h2 class=\"h-sub\" style=\"max-width:16ch;margin-bottom:clamp(24px,3vw,36px)\">Continue lendo.<\u002Fh2>\n      <div style=\"
