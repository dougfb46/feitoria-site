    <p class=\"art-dek\">A cidade tem cinturão verde, feira forte e produtor a poucos quilômetros. Seria estranho comprar longe.<\u002Fp>\n      <p class=\"art-meta\">\n        <time datetime=\"2026-07-29\">29 jul 2026<\u002Ftime>\n        <span aria-hidden=\"true\">·<\u002Fspan>\n        <span>4 min de leitura<\u002Fspan>\n      <\u002Fp>\n      <figure class=\"art-fig\">\n        <div class=\"ph washed\" style=\"aspect-ratio:3/2\">\n          <img src=\"8a5a59d5-2a91-447d-b3f5-7e5effdadaf8\" srcset=\"087f3e67-f38f-414e-9601-7d355b74a36f 394w, 8a5a59d5-2a91-447d-b3f5-7e5effdadaf8 675w\" sizes=\"(max-width: 760px) 100vw, 720px\" width=\"675\" height=\"1200\" fetchpriority=\"high\" decoding=\"async\" alt=\"Horta do cinturão verde de Mogi das Cruzes\">\n        <\u002Fdiv>\n      <\u002Ffigure>\n      <h2>Estamos em cima de uma horta<\u002Fh2>\n      <p>Mogi das Cruzes abastece boa parte da Grande São Paulo com folha e legume. Isso significa que aqui o produto chega no mesmo dia em que foi colhido, sem depender de caminhão de longa distância.<\u002Fp>\n      <p>Quando a alface tem gosto de alface, metade do mérito é da distância curta.<\u002Fp>\n      <h2>A feira dita o prato do dia<\u002Fh2>\n      <p>O prato do dia não nasce de um planejamento de trinta dias. Ele nasce do que estava bom quando a gente foi comprar. Se o cogumelo apareceu excelente, ele entra; se não, muda.<\u002Fp>\n      <p>É mais trabalho e menos previsível, mas é a diferença entre cozinhar com ingrediente e cozinhar com estoque.<\u002Fp>\n      <h2>Fornecedor com nome e telefone<\u002Fh2>\n      <p>A gente prefere comprar de quem podemos ligar. Pão, embutido, queijo, hortaliça: quando existe uma pessoa do outro lado, é possível pedir ajuste, avisar de um problema e combinar entrega.<\u002Fp>\n      <p>Também é o tipo de relação que segura a qualidade num mês difícil.<\u002Fp>\n      <h2>Cerveja daqui, para quem é daqui<\u002Fh2>\n      <p>Fabricar na cidade em que a gente serve fecha o ciclo. O chopp não viaja, o barril não fica dias em caminhão e o dinheiro circula perto de casa.<\u002Fp>\n      <p>É o argumento mais simples que temos: o que está no seu copo foi feito a poucos minutos da sua mesa.<\u002Fp>\n      <div class=\"art-cta\">\n        <a class=\"btn btn-secondary\" href=\"../quem-somos.html#diario\">Voltar ao Diário<\u002Fa>\n        <a class=\"btn btn-ghost\" href=\"https://cardapio.takeat.app/feitoriapubcafe\" target=\"_blank\" rel=\"noopener\" data-ev=\"clique_cardapio\">Ver o cardápio<\u002Fa>\n        <a class=\"btn btn-ghost\" href=\"https://www.instagram.com/feitoria.mogi/\" target=\"_blank\" rel=\"noopener\" data-ev=\"clique_instagram\">@feitoria.mogi<\u002Fa>\n        <a class=\"btn btn-primary\" href=\"../index.html#reservas\" data-ev=\"clique_reservar\">Reservar mesa<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Farticle>\n\n  <aside class=\"on-surface\">\n    <div class=\"wrap sec-sm\">\n      <h2 class=\"h-sub\" style=\"max-width:16ch;margin-bottom:clamp(24px,3vw,36px)\">Continue lendo.<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:clamp(20px,2.6vw,32px)\">\n        <a class=\"card\" href=\"o-que-entra-na-torneira.html\" data-ev=\"abrir_artigo\">\n          <div class=\"ph washed r1610\" style=\"border-radius:0\"><img src=\"ecb9b3f0-6cb2-43de-ad02-667b6b013c5a\" width=\"675\" height=\"1200\" loading=\"lazy\" decoding=\"async\" alt=\"Torneiras da Feitoria servindo o chopp da casa\"><\u002Fdiv>\n          <div class=\"card-in\">\n            <p class=\"card-kicker\">Taplist · Cervejaria<\u002Fp>\n            <h3 class=\"card-title\">Como a gente escolhe o que entra na torneira<\u002Fh3>\n            <p class=\"card-meta\">2 set 2026 · 4 min<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fa>\n        <a class=\"card\" href=\"do-grao-ao-copo.html\" data-ev=\"abrir_artigo\">\n          <div class=\"ph washed r1610\" style=\"border-radius:0\"><img src=\"599fa5d4-2568-4b87-9a
