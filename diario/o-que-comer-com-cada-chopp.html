 chopp<\u002Fh1>\n      <p class=\"art-dek\">Harmonização sem cerimônia, usando o que está no nosso cardápio: tábua, costelinha, Schüblig, pastel e batata.<\u002Fp>\n      <p class=\"art-meta\">\n        <time datetime=\"2026-08-12\">12 ago 2026<\u002Ftime>\n        <span aria-hidden=\"true\">·<\u002Fspan>\n        <span>4 min de leitura<\u002Fspan>\n      <\u002Fp>\n      <figure class=\"art-fig\">\n        <div class=\"ph washed\" style=\"aspect-ratio:3/2\">\n          <img src=\"3934cea4-ca06-4cd5-a263-0ca2efef350f\" srcset=\"c8a834ea-18f9-43e4-921f-4b6d1429d9ca 394w, 3934cea4-ca06-4cd5-a263-0ca2efef350f 675w\" sizes=\"(max-width: 760px) 100vw, 720px\" width=\"675\" height=\"1200\" fetchpriority=\"high\" decoding=\"async\" alt=\"Tábua de frios e petiscos para dividir na mesa\">\n        <\u002Fdiv>\n      <\u002Ffigure>\n      <h2>A regra que resolve 90% dos casos<\u002Fh2>\n      <p>Ou você acompanha, ou você contrasta. Prato leve com cerveja leve, prato intenso com cerveja intensa — isso é acompanhar. Fritura com cerveja seca e gaseificada, doce com amargo — isso é contrastar.<\u002Fp>\n      <p>Não existe erro grave. Existe combinação que faz o prato e o copo parecerem melhores juntos do que separados.<\u002Fp>\n      <h2>Fritura pede gás e final seco<\u002Fh2>\n      <p>Batata do Presidente, pastéis, coxinhas sem massa: tudo isso deixa a boca oleosa, e é exatamente aí que uma pilsen bem gelada trabalha. O gás limpa, o final seco reseta o paladar e o próximo pedaço volta a ter graça.<\u002Fp>\n      <p>Se quiser subir um degrau, uma APA também dá conta — o amargor faz o mesmo serviço com mais aroma.<\u002Fp>\n      <h2>Carne com fumaça quer malte<\u002Fh2>\n      <p>Costelinha BBQ e o especial da casa com carnes e mandioca vão bem com cerveja de perfil maltado: dark lager, bock, algo com caramelo no aroma. O doce do malte conversa com o doce da glaze e com a fumaça.<\u002Fp>\n      <p>IPA aqui costuma brigar: amargor mais fumaça soma e cansa antes do fim do prato.<\u002Fp>\n      <h2>Salsicha alemã pede weizen<\u002Fh2>\n      <p>Schüblig e Weisswurst com uma weizen é combinação clássica e não é por acaso. O trigo cremoso equilibra a gordura da salsicha, e o cravo da levedura conversa com o tempero da carne.<\u002Fp>\n      <p>Se tiver mostarda na mesa, melhor ainda.<\u002Fp>\n      <h2>Tábua para dividir aceita quase tudo<\u002Fh2>\n      <p>A tábua tem de tudo um pouco, então ela é o prato mais democrático da casa. Aqui a régua de degustação brilha: quatro copos diferentes na mesa e cada mordida encontra o par.<\u002Fp>\n      <p>É o pedido que a gente recomenda para quem chegou em grupo e ainda está decidindo.<\u002Fp>\n      <div class=\"art-cta\">\n        <a class=\"btn btn-secondary\" href=\"../quem-somos.html#diario\">Voltar ao Diário<\u002Fa>\n        <a class=\"btn btn-ghost\" href=\"https://cardapio.takeat.app/feitoriapubcafe\" target=\"_blank\" rel=\"noopener\" data-ev=\"clique_cardapio\">Ver o cardápio<\u002Fa>\n        <a class=\"btn btn-ghost\" href=\"https://www.instagram.com/feitoria.mogi/\" target=\"_blank\" rel=\"noopener\" data-ev=\"clique_instagram\">@feitoria.mogi<\u002Fa>\n        <a class=\"btn btn-primary\" href=\"../index.html#reservas\" data-ev=\"clique_reservar\">Reservar mesa<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Farticle>\n\n  <aside class=\"on-surface\">\n    <div class=\"wrap sec-sm\">\n      <h2 class=\"h-sub\" style=\"max-width:16ch;margin-bottom:clamp(24px,3vw,36px)\">Continue lendo.<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:clamp(20px,2.6vw,32px)\">\n        <a class=\"card\" href=\"o-que-entra-na-torneira.html\" data-ev=\"abrir_artigo\">\n          <div class=\"ph washed r1610\" style=\"border-radius:0\"><img src=\"5fe2fdca-639b-4d7d-983d-0c473b934bc7\" width=\"675\" height=\"1200\" loading=\"lazy\" decoding=\"async\" alt=\"Torneiras da Feitoria servindo o chopp da casa\"><\u002Fdiv>\n          <div class=\"
